<style>

}

  --yes-tint:rgba(83,195,141,.17); --no-tint:rgba(239,133,103,.16); --accent-tint:rgba(142,174,240,.12);
  --accent-2:#B9A2F7; --shadow:rgba(0,0,0,.45); --dot:#1D2621;

:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#151C18; --stage:#111714; --ink:#E4EBE6; --muted:#97A49C; --line:#29332D;
  --accent:#8EAEF0; --on-accent:#0E1311; --yes:#53C38D; --no:#EF8567; --on-tok:#0E1311;
  --yes-tint:rgba(83,195,141,.17); --no-tint:rgba(239,133,103,.16); --accent-tint:rgba(142,174,240,.12);
  --accent-2:#B9A2F7; --shadow:rgba(0,0,0,.45); --dot:#1D2621;

body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:16px;
  background:radial-gradient(1100px 520px at 8% -8%,var(--accent-tint),transparent 62%),radial-gradient(900px 460px at 104% 4%,var(--yes-tint),transparent 60%),var(--bg);background-attachment:fixed}

.curve{stroke:var(--accent);stroke-width:3;fill:none}
.fill-m{fill:var(--muted)} .fill-yes{fill:var(--yes)} .fill-no{fill:var(--no)} .fill-acc{fill:var(--accent)}

.n-yes.path,.n-no.path{stroke-width:5}
.dash{stroke:var(--muted);stroke-dasharray:5 5;stroke-width:1.5;fill:none}
#layer [data-k].enter{animation:enter .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0ms)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}

@keyframes win{50%{stroke-width:6}}
#ghost{animation:fadeout .35s ease both;pointer-events:none}
@keyframes fadeout{to{opacity:0}}
@media (prefers-reduced-motion: reduce){#layer [data-k].enter,#layer .enter .grow,#layer .enter .win,.flow,.pulse,.cap-say.swap,.cap-ch.swap{animation:none}#layer .enter .edge[pathLength]{animation:none;stroke-dasharray:none}#ghost{display:none}}
@media (max-width:600px){.caption{padding:12px 14px 12px 18px}.bar{padding:10px}.logo{width:42px;height:42px}}

<script>
/* ---------- data from the slides (Decision Tree: Where to Split the Data?) ---------- */
const RAW=[[1,'High','Medium','Sunny','False','No'],[2,'High','High','Sunny','True','No'],[3,'Low','Low','Rain','True','No'],[4,'Medium','High','Sunny','False','No'],[5,'Low','Medium','Rain','True','No'],[6,'High','Medium','Overcast','False','Yes'],[7,'Low','High','Rain','False','Yes'],[8,'Low','Medium','Rain','False','Yes'],[9,'Low','Low','Overcast','True','Yes'],[10,'Low','Low','Sunny','False','Yes'],[11,'Medium','Medium','Rain','False','Yes'],[12,'Medium','Low','Sunny','True','Yes'],[13,'Medium','High','Overcast','True','Yes'],[14,'High','Low','Overcast','False','Yes']];
const ALL=RAW.map(r=>({id:r[0],Temperature:r[1],Humidity:r[2],Outlook:r[3],Wind:r[4],Play:r[5]}));
const ORDER={Outlook:['Sunny','Overcast','Rain'],Temperature:['High','Medium','Low'],Humidity:['High','Medium','Low'],Wind:['False','True']};
const byId=id=>ALL.find(r=>r.id===id);
const SUNNY=ALL.filter(r=>r.Outlook==='Sunny'), RAIN=ALL.filter(r=>r.Outlook==='Rain');
const lg=Math.log2;
const cnt=rs=>({y:rs.filter(r=>r.Play==='Yes').length,n:rs.filter(r=>r.Play==='No').length});
const ent=rs=>{const{y,n}=cnt(rs),t=y+n;return [y,n].filter(c=>c>0).reduce((s,c)=>s-(c/t)*lg(c/t),0)};
const parts=(rs,a)=>ORDER[a].map(v=>({v,rows:rs.filter(r=>r[a]===v)})).filter(p=>p.rows.length);
const info=(rs,a)=>parts(rs,a).reduce((s,p)=>s+p.rows.length/rs.length*ent(p.rows),0);
const f3=x=>Math.abs(x)<5e-4?'0':x.toFixed(3);
const eq=(terms,total)=>Math.abs(terms.reduce((s,t)=>s+(+f3(t)),0)-(+f3(total)))<1e-9?'=':'≈';

/* ---------- svg helpers ---------- */
const K=(k,inner,x,y)=>`<g data-k="${k}"${x!=null?` data-x="${x}" data-y="${y}"`:''}>${inner}</g>`;
const T=(x,y,s,cls='')=>`<text x="${x}" y="${y}" class="${cls}">${s}</text>`;
const R=(x,y,w,h,cls,rx=10)=>`<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${h}" rx="${rx}" class="${cls}"/>`;
const tok=(id,x,y,r=14)=>K('r'+id,`<circle cx="${x}" cy="${y}" r="${r}" class="tk ${byId(id).Play==='Yes'?'yes':'no'}"/><circle cx="${x}" cy="${y}" r="${r}" fill="url(#shine)"/><text x="${x}" y="${y+0.5}" class="tk-t" style="font-size:${Math.round(r*0.95)}px">${id}</text>`,x,y);

const STEPS=['Class entropy','Weighted entropy','Information gain','Pick highest gain','Repeat on impure','Pure → leaf'];
function strip(active){
  let s='';
  STEPS.forEach((t,i)=>{const x=40+i*203,on=i+1===active,done=active&&i+1<active;
    s+=R(x,12,193,34,'chip '+(on?'on':done?'done':''),17)+`<text x="${x+16}" y="29.5" class="chip-t ${on?'on':''}" dominant-baseline="central">${i+1}  ${t}</text>`});
  return K('strip',s);
}

/* data table: tokens sit in the # column */
const COLS=[['#',58],['Temperature',150],['Humidity',130],['Outlook',130],['Wind',100],['Play',84]];
function table(rs,o={}){
  const x0=o.x??40,y0=o.y??80,rh=o.rh??31;let s='',xs=[],x=x0;
  COLS.forEach(([,w])=>{xs.push(x);x+=w});const W=x-x0,H=34+rs.length*rh;

function treeOneDetail(full){
  const f=FOREST[0],t=f.t,{y}=cnt(f.rs);
  let s=K('t1a',T(40,96,'Tree 1 is trained on Sample 1 only','h2'))+f.s.map((id,j)=>sTok(0,j,id,58+j*38,140)).join('');
  s+=K('t1b',T(40,200,`H(Sample 1) = ${f3(t.H)}   (${y} Yes · ${14-y} No)`,'mono'));
  s+=K('t1c',R(40,222,560,58+t.cands.length*30,'panel',10)+T(58,250,'Root: 2 features picked at random (of 4)','s bold m')+t.cands.map((c,i)=>{const win=c.a===t.attr,yy=282+i*30;return T(58,yy,c.a,'h3'+(win?' acc':''))+R(200,yy-14,Math.max(3,c.g/t.H*230),16,(win?'bar-w':'bar-m')+' grow',4)+T(582,yy,`gain ${f3(c.g)}${win?' ✓':''}`,'mono s end'+(win?' acc bold':''))}).join(''));
  if(full){const rows=[];
    (function walk(n){if(!n.kids)return;n.kids.forEach(c=>{const m=c.node,where=`${n.attr} = ${c.v}`;
      if(m.attr)rows.push([where,`picked ${nameList(m.cands.map(q=>q.a))} → ${m.attr} wins (gain ${f3(m.cands.find(q=>q.a===m.attr).g)})`]);
      else rows.push([where,m.H===0?`pure (${m.y}/${m.n} Yes) → leaf ${m.leaf}`:`mixed (${m.y}/${m.n} Yes) → majority leaf ${m.leaf}`]);walk(m)})})(t);
    s+=K('t1d',T(40,370,'Then every branch, same recipe:','h3')+rows.map((r,i)=>T(40,404+i*30,r[0],'mono s bold')+T(250,404+i*30,r[1],'s')).join(''))}
  s+=ftree(0,660,580,190,170,{maxDepth:full?9:0});
  return s;
}

   draw:()=>strip(5)+splitView(RAIN,'Humidity',{name:'S(Rain)',showH:true,showP:true,showI:true,showGain:true})},
  {step:5,say:'Wind: every calm day is Yes and every windy day is No. Both branches are pure, so the gain is the full 0.971.',
   draw:()=>strip(5)+splitView(RAIN,'Wind',{name:'S(Rain)',showH:true,showP:true,showI:true,showGain:true})},
  {step:4,say:'Wind wins on the Rain branch, so it becomes the node under Rain.',
   draw:()=>strip(4)+gainsChart(RAIN,['Temperature','Humidity','Wind'],'S(Rain)')},
  {step:6,say:'Both Wind branches are pure. Wind False becomes a Yes leaf and Wind True becomes a No leaf.',
   draw:()=>strip(6)+treeView({over:'leaf',sunny:'split',rain:'split',cands:'rain'})},
 ]},
 {t:'Step 6 · Stop: the final tree',scenes:[
  {step:6,say:'Every leaf now has entropy 0, so there is nothing left to split and ID3 stops. This is the final tree, the same one shown in the slides. Temperature was never used, because it never had the best gain.',
   draw:()=>strip(6)+treeView({over:'leaf',sunny:'split',rain:'split'})},
  {step:6,say:'Real data is rarely this clean. The slides list three more reasons to stop: no attribute reaches a minimum information gain, the tree reaches a maximum depth, or a node holds fewer than a set number of examples. These are optional practical rules beyond basic ID3, which also stops when no unused attributes remain and predicts the majority class.',
   draw:()=>strip(6)+K('stop',T(40,100,'When to stop in real data','h2')+T(40,132,'Optional practical stopping rules (beyond basic ID3):','m')+[['Gain too small','No attribute reaches a minimum','information gain threshold.'],['Tree too deep','A maximum depth is reached.','Bigger trees are harder to interpret.'],['Too few examples','The node holds fewer than a','set number of examples.']].map(([a,b,c],i)=>R(40+i*408,170,384,170,'panel',12)+T(64+i*408,214,a,'h3 acc')+T(64+i*408,252,b,'')+T(64+i*408,278,c,'')).join(''))+K('stop2',R(40,380,1200,90,'boxacc',12)+T(64,420,'In our example every leaf reached entropy 0, so rule 6 (pure → leaf) was enough.','h3 acc')+T(64,450,'Mixed leaves would predict the majority class of their days.','s m'))},
 ]},
 {t:'Using the tree',scenes:[
  {step:null,say:'To classify a new day, start at the root and follow the edges. A new day: Rain, Medium temperature, High humidity and windy. Outlook is Rain, so take the Rain branch. Wind is True, so the prediction is No: no tennis.',
   draw:()=>treeView({over:'leaf',sunny:'split',rain:'split',path:['root','rain','rT']})+dayCard(PREDICT_A,['Outlook','Wind'],'No')},
  {step:null,say:'Another day: Sunny with Low humidity. Outlook is Sunny, then Humidity is Low, so the tree predicts Yes. Only the attributes on the path are checked.',
   draw:()=>treeView({over:'leaf',sunny:'split',rain:'split',path:['root','sunny','sL']})+dayCard(PREDICT_B,['Outlook','Humidity'],'Yes',978)},
  {step:null,say:'Recap. Entropy measures how mixed a group is. Information gain measures how much a split reduces it. ID3 always splits on the attribute with the highest gain, and repeats on each branch until every branch is pure.',
   draw:()=>K('recap',T(40,100,'Recap: every number in this tree','h2')+[['S (14 days)','H = 0.940','Outlook','0.247'],['S(Sunny) (5 days)','H = 0.971','Humidity','0.971'],['S(Rain) (5 days)','H = 0.971','Wind','0.971'],['S(Overcast) (4 days)','H = 0','leaf: Yes','none']].map((r,i)=>{const y=150+i*72;return R(40,y,1200,58,i%2?'panel':'thead',10)+T(64,y+36,r[0],'h3')+T(420,y+36,r[1],'mono')+T(640,y+36,i===3?'result →':'best split →','s m')+T(780,y+36,r[2],'h3 acc')+T(1000,y+36,r[3]==='none'?'already pure':`gain ${r[3]}`,'mono s'+(r[3]==='none'?' yes-t':' acc'))}).join('')+T(40,470,'Entropy = how mixed a group is.   Gain = how much a split reduces it.','h3')+T(40,506,'ID3 picks the highest gain; stop at purity or when no attributes remain.','m'))},
 ]},
 {t:'Random forest: the idea',scenes:[
  {step:null,say:'Part 2: random forests. A random forest is an ensemble of many decision trees whose answers are combined. It uses bagging: each tree is trained on its own random sample of the data, every tree makes a prediction, and the forest takes the majority vote.',
   draw:()=>rfIntro()},
 ]},
 {t:'RF Step 1 · Random subsets',scenes:[
  {step:null,say:'Step 1: make random subsets of the training data. We draw 14 days from our 14 at random, with replacement. Some days are picked two or three times and some are not picked at all. This is called a bootstrap sample.',
   draw:()=>stripRF(1)+sampleRows(1)},
  {step:null,say:'Repeat this for every tree. Here we build a small forest of 3 trees, so we draw 3 samples; the slides use 1000. Each sample is a slightly different version of the same data.',
   draw:()=>stripRF(1)+sampleRows(3)},
 ]},
 {t:'RF Step 2 · Train a tree on each subset',scenes:[
  {step:null,say:'Step 2: train one decision tree per sample with the same ID3 recipe from part 1: entropy, information gain, best split. There is one change. At each split the tree compares only a random subset of the features, here 2 of the 4. For the root of Tree 1 it got Humidity and Outlook, and Outlook has the higher gain.',
   draw:()=>stripRF(2)+treeOneDetail(false)},
  {step:null,say:'The tree keeps growing the same way. Every branch gets its own random pair of features and the highest gain wins. Pure branches become leaves. Here the trees stop at depth 2, and a mixed node predicts its majority class.',
   draw:()=>stripRF(2)+treeOneDetail(true)},
  {step:null,say:'Trees 2 and 3 are trained the same way on their own samples. Each tree saw different data and different random features, so the three trees are different: their roots are Outlook, Temperature and Wind.',
   draw:()=>stripRF(2)+forestPanels()},
 ]},
 {t:'RF Steps 3–4 · Predict and vote',scenes:[
  {step:null,say:'Step 3: each tree predicts a new day independently. The day is Sunny, Medium temperature, High humidity and windy. Follow the highlighted path in each tree: Tree 1 says No, Tree 2 says Yes, Tree 3 says No.',
   draw:()=>stripRF(3)+forestPanels({day:RF_DAY})},
  {step:null,say:'Step 4: the final prediction is the majority vote. No has 2 votes and Yes has 1, so the random forest predicts No. Voting combines their answers; it does not guarantee a correct prediction.',
   draw:()=>stripRF(4)+votesView()},
 ]},
 {t:'Decision tree vs random forest',scenes:[
  {step:null,say:'How are they connected? A random forest is built from decision trees, and each tree is grown with exactly the entropy and information gain steps from part 1. The forest adds randomness in the data and in the features, then combines the trees by voting. A forest often reduces variance, but better accuracy is not guaranteed.',
   draw:()=>compareView()},
 ]},
];

function heroTree(){
  const e=(x1,y1,x2,y2)=>`<path d="M${x1} ${y1}C${x1} ${(y1+y2)/2},${x2} ${(y1+y2)/2},${x2} ${y2}" pathLength="1" class="edge"/>`;
  return K('hero',e(640,96,560,150)+e(640,96,720,150)+e(720,178,680,196)+e(720,178,760,196)+
    R(596,64,88,32,'n-attr',9)+`<text x="640" y="85" class="mid bold" style="font-size:14px">Outlook?</text>`+
    R(526,150,68,28,'n-yes',8)+`<text x="560" y="169" class="mid bold yes-t" style="font-size:13px">Yes</text>`+
    R(680,150,80,28,'n-attr',8)+`<text x="720" y="169" class="mid bold" style="font-size:13px">Wind?</text>`+
    `<circle cx="680" cy="200" r="7" class="fill-yes"/><circle cx="760" cy="200" r="7" class="fill-no"/>`);
}
function piles(){
  const ys=ALL.filter(r=>r.Play==='Yes'),ns=ALL.filter(r=>r.Play==='No');
  return K('pl',T(760,112,'Yes: 9 days','h3 yes-t')+T(1020,112,'No: 5 days','h3 no-t')+T(760,250,'p(Yes) = 9/14 = 0.643','mono s')+T(1020,250,'p(No) = 5/14 = 0.357','mono s'))+
    ys.map((r,j)=>tok(r.id,778+(j%5)*38,146+Math.floor(j/5)*38,14)).join('')+ns.map((r,j)=>tok(r.id,1038+(j%5)*38,146,14)).join('');
}
function rootCalc(){
  const ty=-(9/14)*lg(9/14),tn=-(5/14)*lg(5/14);
  return lines('rc',760,310,['H(S) = −(9/14)log₂(9/14) − (5/14)log₂(5/14)','     = −0.643·(−0.637) − 0.357·(−1.485)',`     = ${f3(ty)} + ${f3(tn)}`,`     ≈ ${f3(ty+tn)}`],i=>i===3?'mono bold acc l':'mono s',40);
}

/* ---------- player ---------- */

// Add movement checkpoints before showing completed paths and trees.
const useChapter=CH.find(c=>c.t==='Using the tree');
useChapter.scenes.unshift(
 {step:null,say:'New day enters the root: Outlook = Rain.',draw:()=>treeView({over:'leaf',sunny:'split',rain:'split',path:['root']})+dayCard(PREDICT_A,['Outlook'])+walker('root')},
 {step:null,say:'Follow Rain. Next question: Wind = True?',draw:()=>treeView({over:'leaf',sunny:'split',rain:'split',path:['root','rain']})+dayCard(PREDICT_A,['Outlook','Wind'])+walker('rain')},
 {step:null,say:'Follow True to the No leaf. Prediction complete.',draw:()=>treeView({over:'leaf',sunny:'split',rain:'split',path:['root','rain','rT']})+dayCard(PREDICT_A,['Outlook','Wind'],'No')+walker('rT')}
);
const predictChapter=CH.find(c=>c.t==='RF Steps 3–4 · Predict and vote');
predictChapter.scenes.unshift(
 {step:null,say:'Send the same new day to all three tree roots. The trees work independently.',draw:()=>stripRF(3)+forestPanels({day:RF_DAY,pathDepth:0})},
 {step:null,say:'Each tree asks its own root question. The new day moves to the matching branch.',draw:()=>stripRF(3)+forestPanels({day:RF_DAY,pathDepth:1})}
);
const growChapter=CH.find(c=>c.t==='RF Step 2 · Train a tree on each subset');
growChapter.scenes.splice(growChapter.scenes.length-1,0,
 {step:null,say:'Each sample chooses its own root from its randomly selected features.',draw:()=>stripRF(2)+forestPanels({maxDepth:0})},
 {step:null,say:'Split each sample. Repeat independently within each branch.',draw:()=>stripRF(2)+forestPanels({maxDepth:1})}
);
function walker(id){const[x,y]=TN[id];return K('dt-traveller',`<circle cx="${x}" cy="${y-45}" r="11" class="pulse"/><circle cx="${x}" cy="${y-45}" r="11" class="fill-acc"/>`+R(x-38,y-86,76,24,'tag',12)+`<text x="${x}" y="${y-69}" class="mid bold acc" style="font-size:14px">new day</text>`,x,y-45)}
const SCENES=[];
function rebuild(){SCENES.length=0;const process=$('mode').value==='process';CH.forEach((c,ci)=>c.scenes.forEach((s,si)=>{
 if(process&&(c.t==='Entropy: measuring impurity'||c.t==='The big picture: from data to tree'||(c.t==='The task'&&si!==1)||(c.t==='Step 6 · Stop: the final tree'&&si===1)||(c.t==='Using the tree'&&si===3)))return;
 const brief=s.say.split(/(?<=\.)\s/)[0];SCENES.push({...s,ci,si,caption:process?brief:s.say});
}));document.querySelectorAll('.chap').forEach((b,ci)=>{b.parentElement.hidden=!SCENES.some(s=>s.ci===ci)});
 document.querySelectorAll('.seg').forEach((b,ci)=>{b.hidden=!SCENES.some(s=>s.ci===ci)});}

const $=id=>document.getElementById(id),layer=$('layer'),ghost=$('ghost'),NS='http://www.w3.org/2000/svg';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let idx=0,playing=false,timer=null,t0=0,dur=1,speed=1,raf=0;

function paint(str){
  const tmp=document.createElementNS(NS,'g');tmp.innerHTML=str;
  const newKeys=new Set([...tmp.querySelectorAll('[data-k]')].map(e=>e.dataset.k));
  const prev=new Map();
  ghost.replaceChildren();
  [...layer.children].forEach(el=>{const k=el.dataset&&el.dataset.k;
    if(k&&newKeys.has(k))prev.set(k,el.dataset.x!==undefined?{x:+el.dataset.x,y:+el.dataset.y}:null);
    else ghost.appendChild(el)});
  ghost.style.animation='none';ghost.getBoundingClientRect();ghost.style.animation='';
  layer.replaceChildren(...tmp.childNodes);
  let n=0;
  layer.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;
    if(!prev.has(k)&&el.dataset.origin&&prev.has(el.dataset.origin))prev.set(k,prev.get(el.dataset.origin));if(!prev.has(k)){el.classList.add('enter');el.style.setProperty('--d',Math.min(n++*35,900)+'ms');return}
    const p=prev.get(k);if(!p||reduced||el.dataset.x===undefined)return;
    const dx=p.x-el.dataset.x,dy=p.y-el.dataset.y;if(!dx&&!dy)return;
    el.style.transform=`translate(${dx}px,${dy}px)`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transition='transform 1s cubic-bezier(.6,.05,.25,1)';el.style.transform=''}))});
}

function duration(s){return $('mode').value==='process'?8500:Math.max(5000,s.say.length*62)+1200}
function go(i){
  idx=Math.max(0,Math.min(SCENES.length-1,i));const s=SCENES[idx];
  paint(s.draw());
  const inCh=SCENES.filter(q=>q.ci===s.ci),pos=inCh.indexOf(s)+1;
  ['capCh','capSay'].forEach(id=>{const el=$(id);el.classList.remove('swap');void el.offsetWidth;el.classList.add('swap')});
  $('capCh').textContent=`${s.ci+1}. ${CH[s.ci].t}`;
  $('capN').textContent=inCh.length>1?`${pos} of ${inCh.length}`:'';
  $('capSay').textContent=s.caption;
  $('counter').textContent=`Scene ${idx+1} / ${SCENES.length}`;
  document.querySelectorAll('.chap').forEach((b,j)=>{b.classList.toggle('on',j===s.ci);b.classList.toggle('done',j<s.ci)});
  try{localStorage.setItem('dtrf-scene',idx)}catch(e){}
  schedule();
}
function schedule(){
  clearTimeout(timer);cancelAnimationFrame(raf);
  dur=duration(SCENES[idx])/speed;t0=performance.now();
  if(playing){
    timer=setTimeout(advance,dur);
  }
  tick();
}
function advance(){if(idx<SCENES.length-1)go(idx+1);else{playing=false;syncPlay();tick()}}
function tick(){
  const fr=playing?Math.min(1,(performance.now()-t0)/dur):0;
  const segs=document.querySelectorAll('.seg i'),cur=SCENES[idx].ci;
  CH.forEach((c,ci)=>{const first=SCENES.findIndex(s=>s.ci===ci),n=SCENES.filter(s=>s.ci===ci).length;if(!n){segs[ci].style.width='0%';return}
    let v=ci<cur?1:ci>cur?0:(idx-first+fr)/n;if(ci===cur&&idx===SCENES.length-1&&!playing)v=1;segs[ci].style.width=(v*100)+'%'});
  if(playing)raf=requestAnimationFrame(tick);
}
const ICONS={play:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4.5v15l12-7.5z"/></svg>',pause:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>',replay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>'};
function syncPlay(){$('play').innerHTML=playing?ICONS.pause+'Pause':(idx===SCENES.length-1?ICONS.replay+'Replay':ICONS.play+'Play')}
function toggle(){
  if(!playing&&idx===SCENES.length-1){playing=true;syncPlay();go(0);return}
  playing=!playing;syncPlay();schedule();
}

CH.forEach((c,ci)=>{
  const b=document.createElement('button');b.className='seg';b.title=c.t;b.setAttribute('aria-label','Jump to chapter '+(ci+1)+': '+c.t);b.innerHTML='<i></i>';
  b.onclick=()=>go(SCENES.findIndex(s=>s.ci===ci));$('progress').appendChild(b);
  const li=document.createElement('li'),cb=document.createElement('button');cb.className='chap';cb.innerHTML=`<b>${String(ci+1).padStart(2,'0')}</b><span>${c.t}</span>`;
  cb.onclick=()=>{const i=SCENES.findIndex(s=>s.ci===ci);if(i>=0)go(i)};li.appendChild(cb);$('chapters').appendChild(li);
});
$('play').onclick=toggle;
$('prev').onclick=()=>go(idx-1);
$('next').onclick=()=>go(idx+1);
$('speed').onchange=e=>{speed=+e.target.value;schedule()};
$('fs').onclick=()=>{const p=$('player');try{document.fullscreenElement?document.exitFullscreen():p.requestFullscreen().catch(()=>{})}catch(e){}};
document.addEventListener('keydown',e=>{if(e.target.closest('select'))return;
  if(e.key===' '){e.preventDefault();toggle()}else if(e.key==='ArrowRight')go(idx+1);else if(e.key==='ArrowLeft')go(idx-1);else if(e.key==='f'||e.key==='F')$('fs').click()});
const docEl=document.documentElement;
try{const t=localStorage.getItem('dtrf-theme');if(t)docEl.dataset.theme=t}catch(e){}
$('theme').onclick=()=>{const dark=docEl.dataset.theme?docEl.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches,t=dark?'light':'dark';
  docEl.dataset.theme=t;try{localStorage.setItem('dtrf-theme',t)}catch(e){}};
$('mode').onchange=()=>{rebuild();go(0)};rebuild();let start=0;
go(Number.isFinite(start)?start:0);syncPlay();
</script>
